{% extends "base.html" %}
{% block head %}
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.css">
{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <h1>Новая рецензия</h1>
    <p>{{ book.title }}</p>
  </div>
</section>
<form class="form-panel" method="post">
  <label>
    Оценка
    <select name="rating">
      <option value="5" selected>отлично</option>
      <option value="4">хорошо</option>
      <option value="3">удовлетворительно</option>
      <option value="2">неудовлетворительно</option>
      <option value="1">плохо</option>
      <option value="0">ужасно</option>
    </select>
  </label>
  <label>
    Текст рецензии
    <textarea class="markdown-editor" name="text" required>{{ request.form.get('text', '') }}</textarea>
  </label>
  <div class="form-actions">
    <button class="button" type="submit">Сохранить</button>
    <a class="button ghost" href="{{ url_for('book_detail', book_id=book.id) }}">Отмена</a>
  </div>
</form>
{% endblock %}
{% block scripts %}
  <script src="https://cdn.jsdelivr.net/npm/easymde/dist/easymde.min.js"></script>
  <script>document.querySelectorAll('.markdown-editor').forEach((el) => new EasyMDE({ element: el, spellChecker: false }));</script>
{% endblock %}
